{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QALAAM - Create Account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-bg: #002b24;
            --accent-gold: #ffd700;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at 0% 0%, #004d40 0%, #002b24 50%, #001a15 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            position: relative;
            padding: 2rem 0;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://www.transparenttextures.com/patterns/dark-matter.png');
            opacity: 0.1;
            z-index: -1;
        }

        .register-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 3rem;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-box {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-box h2 {
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
            color: var(--accent-gold);
        }

        .form-control {
            background: rgba(255, 255, 255, 0.07) !important;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white !important;
            border-radius: 12px;
            padding: 0.8rem 1.2rem;
            transition: all 0.3s;
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.1) !important;
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 4px rgba(255, 215, 0, 0.1);
        }

        .form-label {
            font-weight: 500;
            font-size: 0.9rem;
            opacity: 0.8;
            margin-bottom: 0.5rem;
        }

        .btn-primary {
            background-color: var(--accent-gold);
            border: none;
            color: #002b24;
            font-weight: 700;
            border-radius: 12px;
            padding: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
            margin-top: 1rem;
        }

        .btn-primary:hover {
            background-color: #ffea00;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(255, 215, 0, 0.3);
        }

        .footer-links {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.85rem;
        }

        .footer-links a {
            color: var(--accent-gold);
            text-decoration: none;
            transition: opacity 0.3s;
        }

        .footer-links a:hover {
            opacity: 0.8;
        }

        .help-text {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 0.25rem;
        }

        ul.errorlist {
            list-style: none;
            padding: 0;
            color: #ff808b;
            font-size: 0.8rem;
            margin-bottom: 1rem;
        }
    </style>
</head>

<body>

    <div class="register-card">
        <div class="logo-box">
            <i class="bi bi-person-plus-fill d-block fs-1 mb-2"></i>
            <h2>CREATE ACCOUNT</h2>
            <p class="text-white-50 small">Join the Qalaam Digital Community</p>
        </div>

        <form method="post">
            {% csrf_token %}
            
            {% for field in form %}
            <div class="mb-3">
                <label class="form-label">{{ field.label }}</label>
                {{ field.errors }}
                <input type="{{ field.field.widget.input_type|default:'text' }}" 
                       name="{{ field.name }}" 
                       class="form-control" 
                       placeholder="Enter {{ field.label|lower }}"
                       required>
                {% if field.help_text %}
                <div class="help-text">{{ field.help_text|safe }}</div>
                {% endif %}
            </div>
            {% endfor %}

            <div class="d-grid mt-4">
                <button type="submit" class="btn btn-primary">Create My Account</button>
            </div>
        </form>

        <div class="footer-links">
            <span class="opacity-50">Already have an account?</span> 
            <a href="{% url 'dashboard:login' %}">Sign In</a>
            <br>
            <a href="/" class="d-inline-block mt-3 opacity-50">
                <i class="bi bi-arrow-left me-1"></i> Back to Home
            </a>
        </div>
    </div>

</body>

</html>
