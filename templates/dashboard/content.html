{% extends 'dashboard/base.html' %}

{% block page_title %}Content Management{% endblock %}

{% block main %}
<div class="row g-3">
    {% for label, url_name, icon, color in content_links %}
    <div class="col-md-4">
        <a href="{% url url_name %}" class="text-decoration-none">
            <div class="card border-0 shadow-sm h-100 p-3">
                <div class="d-flex align-items-center">
                    <div class="bg-{{ color }} bg-opacity-10 rounded-circle p-3 me-3">
                        <i class="bi bi-{{ icon }} text-{{ color }} fs-3"></i>
                    </div>
                    <div>
                        <h6 class="mb-0 fw-bold text-dark">{{ label }}</h6>
                        <small class="text-muted">Manage {{ label|lower }}</small>
                    </div>
                </div>
            </div>
        </a>
    </div>
    {% endfor %}
</div>
{% endblock %}
